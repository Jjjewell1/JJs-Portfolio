services:
  frontend:
    build: .
    networks: [default, coolify]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.jjweb.rule=Host(`jjs.jewellcore.com`)
      - traefik.http.routers.jjweb.entrypoints=http
      - traefik.http.services.jjweb.loadbalancer.server.port=3000
    environment:
      DATABASE_URL: "file:/app/data/jewellcore.db"
      SESSION_SECRET: "${SESSION_SECRET}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      FORCE_ADMIN_RESET: "${FORCE_ADMIN_RESET:-false}"
      NTFY_TOPIC_URL: "${NTFY_TOPIC_URL}"
      NTFY_ACCESS_TOKEN: "${NTFY_ACCESS_TOKEN:-}"
    volumes:
      - jjdata:/app/data

volumes:
  jjdata: {}

networks:
  coolify:
    external: true